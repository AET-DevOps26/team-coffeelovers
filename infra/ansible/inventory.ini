[app]
team-coffeelovers ansible_host=172.160.248.100 ansible_user=azureuser ansible_port=22

[app:vars]
ansible_ssh_private_key_file=~/.ssh/devops_key.pem
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
ansible_python_interpreter=/usr/bin/python3

# Application variables
app_path=/opt/team-coffeelovers
repo_url=https://github.com/AET-DevOps26/team-coffeelovers
repo_branch=main
postgres_db=coffeelovers
postgres_user=coffeelovers
postgres_password={{ lookup('env', 'POSTGRES_PASSWORD') | default('coffeelovers-dev') }}
logos_api_key={{ lookup('env', 'LOGOS_API_KEY') | default('') }}
jwt_secret={{ lookup('env', 'JWT_SECRET') | default('your-secret-key-change-in-production') }}
public_api_url=http://172.160.248.100:8081
