---
- name: Prepare Azure VM and deploy the project
  hosts: app
  become: true
  gather_facts: true

  vars:
    base_packages:
      - git
      - ca-certificates
      - curl
      - gnupg

    docker_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin

  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        name: "{{ base_packages }}"
        state: present
        update_cache: true

    - name: Create Docker apt keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker official GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker
        update_cache: true

    - name: Install Docker packages
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present

    - name: Ensure Docker service is enabled and running
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Add the SSH user to the docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_path }}"
        state: directory
        mode: "0755"

    - name: Clone or update the application repository
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_path }}"
        version: "{{ repo_branch }}"
        force: true

    - name: Render the runtime environment file
      ansible.builtin.copy:
        dest: "{{ app_path }}/.env"
        mode: "0600"
        content: |
          POSTGRES_DB={{ postgres_db }}
          POSTGRES_USER={{ postgres_user }}
          POSTGRES_PASSWORD={{ postgres_password }}
          LOGOS_API_KEY={{ logos_api_key }}
          GENAI_PROVIDER=logos
          JWT_SECRET={{ jwt_secret }}
          PUBLIC_API_URL={{ public_api_url }}

    - name: Start the application stack with Docker Compose
      ansible.builtin.command: docker compose -f infra/docker-compose.yml up -d --build
      args:
        chdir: "{{ app_path }}"
      changed_when: false
