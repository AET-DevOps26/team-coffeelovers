services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coffeelovers}
      POSTGRES_USER: ${POSTGRES_USER:-coffeelovers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coffeelovers}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coffeelovers}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  auth-service:
    build:
      context: ../backend
      dockerfile: auth-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-coffeelovers}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-coffeelovers}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-coffeelovers}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SERVER_PORT=8081
      - JWT_SECRET=${JWT_SECRET:-coffeelovers-local-dev-jwt-secret}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  trip-service:
    build:
      context: ../backend
      dockerfile: trip-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-coffeelovers}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-coffeelovers}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-coffeelovers}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - GENAI_BASE_URL=${GENAI_BASE_URL:-http://genai:8001}
    depends_on:
      postgres:
        condition: service_healthy
      genai:
        condition: service_started
    restart: unless-stopped

  client:
    build:
      context: ../client
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8081}
        REACT_APP_TRIP_API_URL: ${REACT_APP_TRIP_API_URL:-http://localhost:8082}
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
    restart: unless-stopped

  genai:
    build:
      context: ../genai
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      GENAI_PROVIDER: ${GENAI_PROVIDER:-mock}
      GENAI_LOG_LEVEL: ${GENAI_LOG_LEVEL:-INFO}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      LOGOS_API_KEY: ${LOGOS_API_KEY:-}
      LOGOS_BASE_URL: ${LOGOS_BASE_URL:-https://logos.aet.cit.tum.de/v1}
      LOGOS_MODEL: ${LOGOS_MODEL:-openai/gpt-oss-120b}
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - trip-service
      - genai
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - auth-service
      - trip-service
      - genai
    restart: unless-stopped
  
  grafana:
    image: grafana/grafana:11.5.2
    ports:
      - 3001:3000
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
