{{- $svc := index .Values.services "genai-service" }}
{{- if $svc.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: genai-credentials
  labels:
    {{- include "coffeelovers.labels" . | nindent 4 }}
type: Opaque
stringData:
  logos-api-key: {{ required "secrets.logosApiKey is required" .Values.secrets.logosApiKey | quote }}
{{- end }}
