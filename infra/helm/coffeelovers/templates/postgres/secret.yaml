apiVersion: v1
kind: Secret
metadata:
  name: {{ include "coffeelovers.postgresSecretName" . }}
  labels:
    {{- include "coffeelovers.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ required "secrets.postgresPassword must be set. Use --set secrets.postgresPassword=<value>" .Values.secrets.postgresPassword | quote }}
