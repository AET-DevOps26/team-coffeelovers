name: CI Pipeline

# Trigger on PRs and on pushes to main, develop and feature branches
on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-check:
    name: Frontend Lint, Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Fetch repo for this job's runner

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
        # Node runtime + npm cache

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Run frontend linter if configured
        working-directory: client
        run: |
          if grep -q '"lint"' package.json; then
            npm run lint
          else
            echo "No lint script found in client/package.json — skipping lint"
          fi
        # Only run lint if project defines a lint script

      - name: Run frontend tests
        working-directory: client
        run: npm test -- --watchAll=false

      - name: Build frontend
        working-directory: client
        run: npm run build

  backend-check:
    name: Backend Static Checks, Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Each job must checkout the repo on its own runner

      - name: Setup Java (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Make gradlew executable
        working-directory: backend
        run: chmod +x ./gradlew

      - name: Run Gradle checks (static analysis + tests) if available
        working-directory: backend
        run: ./gradlew check --no-daemon
        # 'check' runs tests and static checks if configured; fails if problems found

      - name: Build backend artifact
        working-directory: backend
        run: ./gradlew build --no-daemon
        # Produces the JAR; fails the job if build fails

  genai-check:
    name: GenAI Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install GenAI dependencies
        working-directory: genai
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run GenAI tests if configured
        working-directory: genai
        run: |
          if [ -d "tests" ]; then
            pytest
          else
            echo "No tests directory found — skipping tests"
          fi

