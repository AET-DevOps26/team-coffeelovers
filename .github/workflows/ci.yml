  docker-check:
    name: Docker - Build Validation
    runs-on: ubuntu-latest
    needs:
      - frontend-check
      - backend-check
      - genai-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker-compose config
        run: docker compose -f infra/docker-compose.yml config
        # Validates root docker-compose.yml if Docker is available on the runner
      
      - name: Build GenAI Docker image
        run: docker build -t genai-service:test genai/

      - name: Build backend Docker image
        run: docker build -t auth-service:test -f backend/auth-service/Dockerfile backend/

      - name: Build trip-service Docker image
        run: docker build -t trip-service:test -f backend/trip-service/Dockerfile backend/

      - name: Build frontend Docker image
        run: docker build -t client-service:test -f client/Dockerfile client/
  
  terraform-validate:
    name: Terraform - Validate & Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ~1.0

      - name: Terraform Format Check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: infra/terraform
        env:
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: infra/terraform
        env:
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_public_ip_address: ${{ secrets.AZURE_VM_IP }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: infra/terraform
        env:
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_public_ip_address: ${{ secrets.AZURE_VM_IP }}
          TF_VAR_resource_group_name: devops
          TF_VAR_virtual_network_name: devops-vnet
          TF_VAR_subnet_name: default
          TF_VAR_network_interface_name: devops225_z1
          TF_VAR_vm_name: devops
          TF_VAR_admin_username: azureuser
          TF_VAR_location: swedencentral
          TF_VAR_environment: prod
        run: terraform plan -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: infra/terraform/tfplan

  ansible-validate:
    name: Ansible - Validate & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install "ansible>=2.12.0" ansible-lint

      - name: Ansible Lint
        working-directory: infra/ansible
        run: ansible-lint site.yml

      - name: Validate Inventory
        working-directory: infra/ansible
        run: ansible-inventory -i inventory.ini --list --yaml

      - name: Ansible Syntax Check
        working-directory: infra/ansible
        run: ansible-playbook -i inventory.ini site.yml --syntax-check
