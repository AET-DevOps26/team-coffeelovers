name: CD Pipeline

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/aet-devops26/team-coffeelovers

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push client image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          dockerfile: ./client/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/client:latest

      - name: Build and push auth-service image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          dockerfile: ./backend/auth-service/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/auth-service:latest

      - name: Build and push genai-service image
        uses: docker/build-push-action@v5
        with:
          context: ./genai
          dockerfile: ./genai/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/genai-service:latest

  deploy:
    name: Deploy to AET Cluster
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Set up Helm
        uses: azure/setup-helm@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy with Helm
        run: |
          helm upgrade --install coffeelovers ./infra/helm/coffeelovers \
            --namespace team-coffeelovers-devops26 \
            --create-namespace \
            --set secrets.postgresPassword=${{ secrets.POSTGRES_PASSWORD }} \
            --set secrets.openaiApiKey=${{ secrets.OPENAI_API_KEY }} \
            --set global.image.tag=latest \
            --wait --timeout 5m
